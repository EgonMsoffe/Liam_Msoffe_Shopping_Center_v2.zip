
name: Build Liam Msoffe Shopping Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Find Android source ZIP
        run: |
          echo "Files in repository:"
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found in repository root"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f

      - name: Locate Android app
        run: |
          APP_DIR=$(find extracted -type f -name 'build.gradle' | grep '/app/build.gradle$' | head -n 1 | sed 's#/app/build.gradle##')
          if [ -z "$APP_DIR" ]; then
            echo "Android app build.gradle not found"
            find extracted -type f
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$APP_DIR"
          gradle assembleDebug

      - name: Find generated APK
        run: |
          APK=$(find "$APP_DIR" -type f -name 'app-debug.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liam-Msoffe-Shopping-Center-APK
          path: ${{ env.APK }}
