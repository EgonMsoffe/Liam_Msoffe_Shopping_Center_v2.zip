
name: Build Liam Msoffe Shopping Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract Android project
        run: |
          test -f Liam_Msoffe_Shopping_Center_v2.zip
          unzip -o Liam_Msoffe_Shopping_Center_v2.zip -d extracted

      - name: Locate Android project
        run: |
          find extracted -name build.gradle -o -name build.gradle.kts
          test -f extracted/LiamAndroid/app/build.gradle

      - name: Build APK
        run: |
          cd extracted/LiamAndroid
          gradle assembleDebug

      - name: Verify APK
        run: |
          test -f extracted/LiamAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liam-Msoffe-Shopping-Center-APK
          path: extracted/LiamAndroid/app/build/outputs/apk/debug/app-debug.apk
